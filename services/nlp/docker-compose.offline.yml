# RG-P1.S2 — local OFFLINE bring-up: engine-free front + the two self-hosted
# UFAL backends (MorphoDiTa + NameTag 3). No Lindat/HF egress at run time — the
# determinism/offline claim (RG-P1 DoD). This is the harness for the S2.T7 hero
# parse and for running the component parity suite (`-m component`) locally.
#
#   # build (x86 target; QEMU on arm64 dev boxes). UFAL backends need
#   # --build-arg MODEL_URL=<DSpace bitstream URL> (see their Dockerfiles):
#   docker buildx build --platform linux/amd64 -t nlp-morphodita:dev services/nlp/backends/morphodita
#   docker buildx build --platform linux/amd64 -t nlp-nametag3:dev   services/nlp/backends/nametag3
#   docker build -t nlp-stanza:dev services/nlp/backends/stanza
#   docker build -t nlp-spacy:dev  services/nlp/backends/spacy
#   docker build -t nlp:dev -f services/nlp/Dockerfile .
#   # run (from repo root):
#   docker compose -f services/nlp/docker-compose.offline.yml up
#   # hero parse over gRPC (host):
#   grpcurl -plaintext -d '{"text":"Kolik jsme utržili za Octavie v pražských pobočkách za poslední fiskální čtvrtletí?","language":"cs","ops":["TOKENIZE","LEMMATIZE","POS_TAG","DEP_PARSE","NER"]}' \
#     localhost:7271 org.tatrman.nlp.v1.NlpService/Analyze
#   # component parity suite against the running backends:
#   NLP_MORPHODITA_URL=http://localhost:8080/tag NLP_NAMETAG3_URL=http://localhost:8001/recognize \
#     just test-py services/nlp -m component
#
#   # ── NLS-P4.T4: the hero E2E, both lanes (arc gate 2) ──────────────────────
#   # PREREQUISITE for the eval lanes below (first run in a checkout): the harness
#   # imports `org.tatrman.nlp.v1` through the wheel's client, and the service's
#   # stubs are gitignored. `pythonpath` in pyproject.toml is a PYTEST setting and
#   # does not apply to `uv run python`, so both of these are needed:
#   cd services/nlp && uv run python scripts/gen_proto.py
#   export PYTHONPATH=generated        # for every run_eval.py invocation below
#   # Option lane (as configured above) — both heroes must resolve, no degrade:
#   cd services/nlp && uv run python eval/run_eval.py --rules --lane option \
#     --output-json eval/reports/metrics.json --output-md eval/reports/report.md
#
#   # Default lane — same containers, one env var. cs NER goes unrouted, the
#   # response carries NLS-NLP-011, and the invoices hero STILL resolves through
#   # the pack's morphology fallback. That pair is the whole NL-14 claim:
#   NLP_LANE=default docker compose -f services/nlp/docker-compose.offline.yml up -d front
#   cd services/nlp && uv run python eval/run_eval.py --rules --lane default \
#     --output-json eval/reports/metrics-default-lane.json \
#     --output-md eval/reports/report-default-lane.md
#   # Expect: same pass count, and `NLS-NLP-011` in the report's diagnostics line.

services:
  # Service names match the config.yaml default in-cluster hostnames, so the
  # front reaches the backends with no URL override.
  nlp-morphodita:
    image: nlp-morphodita:dev
    build:
      context: ./backends/morphodita
    ports:
      - "8080:8080"

  nlp-nametag3:
    image: nlp-nametag3:dev
    build:
      context: ./backends/nametag3
    ports:
      - "8001:8001"

  # Stanza serves the hero's cs DEP_PARSE (+ en). spaCy is the en NER fallback.
  nlp-stanza:
    image: nlp-stanza:dev
    build:
      context: ./backends/stanza
    ports:
      - "8090:8090"

  nlp-spacy:
    image: nlp-spacy:dev
    build:
      context: ./backends/spacy
    ports:
      - "8091:8091"

  front:
    image: nlp:dev
    build:
      context: ../..
      dockerfile: services/nlp/Dockerfile
    depends_on:
      nlp-morphodita:
        condition: service_healthy
      nlp-nametag3:
        condition: service_healthy
      nlp-stanza:
        condition: service_healthy
      nlp-spacy:
        condition: service_healthy
    environment:
      NLP_SERVICE_GRPC_PORT: "7271"
      NLP_SERVICE_PORT: "7270"
      # Self-hosted tier (default). Do NOT set NLP_UFAL_ENDPOINT_MODE=lindat here
      # — the whole point is offline, no Lindat egress.
      #
      # NLS-P3.2: `option` is the UFAL lane, which is the one this compose file
      # actually brings up — MorphoDiTa and NameTag 3 are running above. Flip to
      # `default` to exercise the NL-14 degrade against the very same containers:
      # the lane stops routing to them, cs NER goes unrouted, and RunPipeline
      # answers with NLS-NLP-011 while the pack's fallback rule still reaches the
      # QueryPattern (NLS-P4.T4 records both runs).
      # Interpolated, NOT literal: the T4 drill's second leg is documented as
      # `NLP_LANE=default docker compose … up -d front`, and against a literal
      # value that command did nothing at all — the front came back up in the
      # option lane and produced a report identical to the first leg. A degrade
      # that silently does not happen is the one failure this recipe exists to
      # rule out, so the default belongs here and the override has to reach it.
      NLP_LANE: "${NLP_LANE:-option}"
      # NLS-P4.T4: the shipped config.yaml carries `pipelines: {}` on purpose —
      # pipeline ids name a world's packs, and referring to unmounted packs would
      # fail the boot load everywhere. This file declares the two the hero recipe
      # runs, over the fixtures mounted below.
      CONFIG_FILE: "/etc/nlp/offline-config.yaml"
    volumes:
      # Rule packs and gazetteer lists, mounted at the paths `config.yaml` names.
      # Content is per-world and never part of the suite (NL-17); these are the
      # wheel's own fixtures, which is what makes the hero recipe runnable from a
      # clean checkout with nothing else to fetch.
      - ../../shared/libs/python/ttr-nlp/tests/fixtures/packs/valid:/etc/nlp/packs:ro
      - ../../shared/libs/python/ttr-nlp/tests/fixtures/lists/valid:/etc/nlp/lists:ro
      - ./eval/offline-config.yaml:/etc/nlp/offline-config.yaml:ro
      # LM (NLS-P9.1) — the compiled Czech snapshot. A BUILD OUTPUT, so run
      # `just morph-compile` first; the recipe's `morph-patterns` pipeline is
      # the only thing that needs it, and the front comes up reporting
      # `LM-MORPH-001` on GetStatus.morph_state if the directory is empty rather
      # than refusing to start (`morph_state.py`).
      - ../../dist/morph:/etc/nlp/morph:ro
      #
      # ⚑ NO world overlay here, deliberately. A world's entity layer is that
      # world's own compiled artifact (LM-10), and the published core does not
      # carry proper nouns — so in the OPTION lane `morph-patterns` reaches the
      # customer's name through NameTag, and in the DEFAULT lane it does not
      # reach it at all. Both are correct, both are worth seeing in the drill,
      # and a fixture overlay smuggled in here would hide the second one.
    ports:
      - "7270:7270"  # REST mirror (dev/health)
      - "7271:7271"  # gRPC contract
