# SPDX-License-Identifier: Apache-2.0
#
# Alembic — the schema of record for morph-studio's working store.
#
# The URL is NOT here: it comes from `MORPH_STUDIO_DB_URL` in `migrations/env.py`,
# because a connection string in a checked-in file is either wrong everywhere or
# a secret in git. `alembic upgrade head` is what a deployment runs; the service
# itself never creates tables (see `morph_studio.db.create_all`).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
