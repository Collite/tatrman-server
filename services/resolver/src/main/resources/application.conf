ktor {
    deployment {
        port = 7275
        port = ${?RESOLVER_SERVER_PORT}
    }
    application {
        modules = [ org.tatrman.resolver.ApplicationKt.module ]
    }
}

grpc {
    port = 7276
    port = ${?RESOLVER_SERVER_GRPC_PORT}
    max-message-size-bytes = 33554432  // 32 MiB per wire-format Rule 5
    reflection-enabled = false
    reflection-enabled = ${?GRPC_REFLECTION_ENABLED}
}

# RG-P6.S1 — the `resolve.bind:v1` MCP door (streamable HTTP), co-hosted in-process
# on its own port. `require-identity` = H-2 fail-closed: with it on, a call with no
# resolvable OBO identity is refused before any resolution work. Default ON; the
# dev-network path sets it false.
mcp {
    port = 7277
    port = ${?RESOLVER_MCP_PORT}
    # Bind host. Loopback by default (RG-P6 review D): the JWT is decoded, NOT
    # signature-verified here, so the door must not be off-host-reachable unless a
    # deployment fronts it with an auth-terminating ingress and sets 0.0.0.0.
    host = "127.0.0.1"
    host = ${?RESOLVER_MCP_HOST}
    require-identity = true
    require-identity = ${?RESOLVER_MCP_REQUIRE_IDENTITY}
    # Identity-source trust (RG-P6 review A). false (default) = TOKEN-ONLY: only an
    # OBO Bearer token is an identity; the `X-User-Id` header, the `user_id` arg, and
    # the `admin:` role convention are all ignored (they can neither satisfy
    # require-identity nor self-grant admin). true = dev / behind-a-terminator: re-open
    # those trusted-network shortcuts.
    trust-network = false
    trust-network = ${?RESOLVER_MCP_TRUST_NETWORK}
}

# nlp — the parse (Analyze) + capability matrix (GetStatus). ZERO LLM here.
nlp {
    host = "nlp"
    host = ${?NLP_HOST}
    port = 7226
    port = ${?NLP_GRPC_PORT}
    deadline-seconds = 30
    deadline-seconds = ${?NLP_GRPC_DEADLINE_SECONDS}
}

# lex-matcher — the vocabulary matcher (BatchMatch). One RPC per resolve (B-T1).
fuzzy {
    host = "fuzzy"
    host = ${?FUZZY_HOST}
    port = 7266
    port = ${?FUZZY_GRPC_PORT}
    deadline-seconds = 30
    deadline-seconds = ${?FUZZY_GRPC_DEADLINE_SECONDS}
}

# Gating thresholds — ported from the live ENTITIES_ONLY config (ResolverGraph:38-48).
resolver {
    threshold-bind = 0.5
    threshold-ambiguity-gap = 0.05
    threshold-exact = 0.9999
    max-options = 20

    # RV-P2.2 — the RV-14 class floor: how similar an UNVOUCHED hit (a data-layer member
    # row, matched by surface similarity with no authored method behind it) must be before
    # it counts as evidence at all. Below it the candidate is WEAK, and WEAK never binds
    # and is never offered as a clarification either. Where the estate DID author a match
    # method the method is the vouching and this floor is not applied.
    #
    # RV-14 ordains the classes but names no number; 0.70 is fitted to the two observations
    # on record (issues.md's 0.667/0.500 garbage below it, the 0.72/0.70 member-ambiguity
    # pair above it) and the reasoning lives on `ResolverThresholds.strong`. Raise it to
    # make the gate stricter — like the other three, a per-request Registry override may
    # only move it in the conservative direction.
    threshold-strong = 0.70

    # RV-P2.3 — the `lookup` rung: the deterministic narrowing loop between the broad
    # pass and emit. Anchored, category-scoped, no LLM, and bounded by WALL CLOCK only —
    # lookup rounds never count as LLM invocations (⚑RV-3), so the ladder's
    # `max_llm_invocations` has nothing to say about them. 250ms is contracts §3's ruled
    # `rung_timeouts_ms.lookup`. Set to 0 to switch the rung off.
    #
    # There is deliberately no round cap: the loop is finite by construction (each round
    # consumes at least one member of a finite span x tier query space), so the budget
    # bounds latency rather than termination.
    lookup-budget-ms = 250
    lookup-max-candidates = 10
    lookup-broad-max-candidates = 10
    lookup-max-queries-per-round = 8

    # Frame-role preposition tables (RV-P2.1.T5). Blank ⇒ the tables shipped in
    # `frame-roles.conf`; a path here replaces them WHOLESALE, which is how "the next
    # language is a data change" (Q-15 handoff item 3) actually reaches a deployment.
    # Same override shape as every other estate-supplied data file in the roster
    # (`FUZZY_LEXICON_ARCHIVE_PATH`, `CHRONO_LEXICON_ARCHIVE_PATH`, …), so one chart
    # idiom covers all of them. An unreadable or malformed file warns and falls back —
    # losing a language's prepositions degrades role derivation, it does not make the
    # core wrong.
    frame-roles {
        config-path = ""
        config-path = ${?RESOLVER_FRAME_ROLES_PATH}
    }

    # HMAC resume-token keys (RS-26 / S-3). Map key_id -> base64url secret (>=32B,
    # enforced at boot); `active-key-id` signs new tokens, every listed key verifies
    # (rotation window). An empty key set is FAIL-CLOSED (the service refuses to boot)
    # unless `allow-ephemeral-key = true` is set for local dev — the ephemeral key
    # breaks stateless resume across replicas/restarts (RG-P6 review L).
    resume-token {
        active-key-id = ${?RESOLVER_RESUME_ACTIVE_KEY_ID}
        # Replay window: a signed pin is honoured only within this many seconds of its
        # `issued_at` (bounds a leaked/logged token). A missing value falls back to 1h
        # in code — never "no expiry" (RG-P6 review K). Verified only after the HMAC clears.
        max-age-seconds = 3600
        max-age-seconds = ${?RESOLVER_RESUME_MAX_AGE_SECONDS}
        # Local-dev only: allow booting with no configured key (ephemeral, per-process).
        allow-ephemeral-key = false
        allow-ephemeral-key = ${?RESOLVER_RESUME_ALLOW_EPHEMERAL_KEY}
        keys {
            # k1 = ${?RESOLVER_RESUME_KEY_K1}
        }
    }
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_RESOLVER}
    otlp {
        endpoint = "http://localhost:4317"
        endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    }
}
