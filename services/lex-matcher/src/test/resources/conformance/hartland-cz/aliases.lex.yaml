# RV-P1.4 T7 — hartland_cz declared-layer conformance fixture.
#
# The Czech world of the hartland demo estate (BM arc: one model, two connections — CZ is a full
# Czech world, not a labels-only re-skin). Targets are hartland's REAL refs; this file is what an
# estate author writes, and the conformance harness compiles and packs it with the actual RV-P1.2
# toolchain rather than hand-building an artifact.
#
# The methods here are chosen to exercise all three, not for authoring taste:
#   EXACT     on short codes and words where a near-miss means something else ("DC", "zásoba")
#   TYPOS(n)  where a typo or a dropped diacritic is the likely input ("zákazník", "prodejna")
#   TOKENS    on multi-word phrases, which is also what makes the RV-32 margin observable
schema: ttr-lexicon/v1
defaults: { lang: cs, method: TOKENS }
entries:
  # ── measures ────────────────────────────────────────────────────────────────────────────
  - terms:
      - { text: "tržby" }
      - { text: "obrat" }
      - { text: "výnosy", method: TYPOS(1) }
      - { text: "tržby celkem" }
    target: md.measure.revenue

  - terms:
      - { text: "množství" }
      - { text: "počet kusů" }
    target: md.measure.quantity

  - terms:
      - { text: "vratky" }
      - { text: "vratky celkem" }
    target: md.measure.returnAmount

  # `zásoba` is EXACT on purpose: `zásobování` (supply) is a different word, and one edit away.
  - terms:
      - { text: "zásoba", method: EXACT }
      - { text: "stav zásob" }
    target: md.measure.onHandQty

  # ── dimensions ──────────────────────────────────────────────────────────────────────────
  # "DC" EXACT: a two-letter code under TYPOS(1) would match most two-letter noise.
  - terms:
      - { text: "distribuční centrum" }
      - { text: "DC", method: EXACT }
    target: md.dimension.DistributionCentre

  - terms:
      - { text: "prodejna", method: TYPOS(1) }
    target: md.dimension.Store

  # ── entities ────────────────────────────────────────────────────────────────────────────
  - terms:
      - { text: "zákazník", method: TYPOS(1) }
      - { text: "odběratel", method: TYPOS(1) }
    target: er.entity.customer

  # ── RV-44 (RV-P3.0): declared matching profiles ─────────────────────────────────────────
  # Added at p3-0 T7. The three cases the addendum's behaviour actually turns on, authored the
  # way an estate would author them — beside the `method:` rows above, not instead of them,
  # because both spellings have to keep working in one corpus.

  # (1) A profile-carrying alias. The FOLDED stratum is the point: `stredisko` finding
  # `středisko` becomes an authored fact with its own score, where today it is reachable only
  # by the accident that two dropped diacritics happen to cost two edits (and so refuses under
  # TYPOS(1), as the `zakaznik` case above records).
  # `příjemka` carries TWO diacritics, deliberately: stripping them costs two edits, so the
  # canonical stratum's TYPOS(1) cannot reach the folded query and the folded rule is the only
  # thing that can. A one-diacritic word would have scored 0.95 by typos and proved nothing.
  - terms:
      - text: "příjemka"
        match:
          - { norm: canonical, exact: 1.00, typos: { distance: 1, penalty: 0.05 } }
          - { norm: folded,    exact: 0.90 }
    target: er.entity.goodsReceipt

  # (2) The ⚑M-4 short-term guard, as an estate trips it: a two-letter code with fuzz declared
  # on it anyway. The build WARNS (RG-LEX-101, asserted in the harness) and the matcher never
  # fuzz-fires it — while the code itself still matches itself.
  - terms:
      - { text: "PJ", method: TYPOS(1) }
    target: md.dimension.Store

  # (3) Sugar equivalence. `pobočka` is written as `method:` sugar and `smlouva` as the profile
  # that sugar MEANS (M-T6). One edit against either must score the same number, or the sugar
  # table is decorative.
  - terms:
      - { text: "pobočka", method: TYPOS(1) }
    target: md.dimension.Branch

  - terms:
      - text: "smlouva"
        match: [ { norm: canonical, exact: 1.00, typos: { distance: 1, penalty: 0.05 } } ]
    target: er.entity.contract
