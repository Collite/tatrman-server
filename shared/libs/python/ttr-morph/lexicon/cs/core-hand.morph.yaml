  # ── the hero verb neither source carried (NLS-P8.4) ────────────────────────
  # `zobrazit` is the first word of the NL hero and it arrived from CAC with a
  # single attested form — the infinitive — because English Wiktionary has no
  # entry for it and the corpus happens never to use its imperative. So *Zobraz*,
  # the word the query actually starts with, had no analysis at all, while the
  # target-coverage number read 147/149: the lemma resolved to itself, and a
  # lemma that resolves to itself out of one form is a word the runtime cannot
  # see in any sentence a user would write. The acceptance case found it; the
  # harness now reports THIN targets so the next one is found by a number.
  #
  # It is a plain `prosit` verb, which is why it needs three words here and not
  # a form table.
  - { lemma: zobrazit, upos: VERB, vzor: prosit, provenance: manual }

  # The same shape, found by the thin check rather than by a case: *pololetí*
  # is syncretic in nine of its cells, so a corpus that used it once looks like
  # a complete entry. It is not — *pololetím* and *pololetích* are the two
  # forms a half-year query actually contains.
  - { lemma: pololetí, upos: NOUN, vzor: stavení, provenance: manual }

