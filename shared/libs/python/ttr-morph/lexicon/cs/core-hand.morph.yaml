# The hand seed — the part of Czech no importer can be trusted with.
#
# HAND-AUTHORED from school grammar, and it stays that way: `license: suite`,
# `provenance: manual`, no Wiktionary and no corpus anywhere in its history.
# This file is the reason the cs path can be called NC-free without an asterisk.
#
# What lives here and why:
#
# * **Closed classes.** Prepositions, conjunctions and particles have no
#   paradigm to import — D-O1 measured 0% table coverage for ADP/CCONJ/PART in
#   both Wiktionary editions, which is not a defect in the source. A preposition
#   is a form, and the only thing a lexicon can say about it is that it exists.
# * **Pronouns and numerals.** Suppletive: *já/mě/mně/mnou* is not a stem plus
#   endings, and no vzor will ever produce it. Full-form entries, every one.
# * **The irregular verbs.** *být, mít, jít, jíst, chtít, moci, vědět* — the
#   seven the language leans on hardest, and the seven no pattern covers.
# * **The contractions** (B-O4), carrying `parts:` so *abych* resolves to
#   *aby* + *bych* rather than to a word nobody looked up.
# * **The ne-exceptions.** *nemoc* is not *ne* + *moc*. Only the lexicon knows
#   that, and without these the runtime's ne-strip turns "illness" into "not
#   power" with a straight face and a lemma that will match a rule.
# * **The vzor lemmas themselves**, so the words the patterns are named after
#   are in the lexicon they define.
#
# ⚑ **Case government is not recorded on prepositions.** Which case *na* takes
# is a fact about a phrase, not about the word, and the lexicon that claimed
# otherwise would have to claim it twice for every preposition that governs two.
#
# ⚑ **This seed is deliberately incomplete**, and the gaps are named in
# `importers-report.md` rather than half-filled. A pronoun paradigm that is 80%
# right is worse than an absent one: the missing fifth returns a confident wrong
# lemma instead of a miss the enrichment queue would pick up (LM-5).

layer: core-hand
version: 1
language: cs
license: suite
attribution: null

entries:

  # ── prepositions (ADP) ─────────────────────────────────────────────────────
  # Vocalised variants (`ve`, `se`, `ze`, `ke`, `beze`…) are FORMS of the same
  # lemma, not lemmas: *ve smlouvě* and *v roce* are one word choosing a shape
  # to fit the next one.
  - { lemma: v, upos: ADP, provenance: manual, forms: [{form: v, feats: "AdpType=Prep"}, {form: ve, feats: "AdpType=Prep"}] }
  - { lemma: s, upos: ADP, provenance: manual, forms: [{form: s, feats: "AdpType=Prep"}, {form: se, feats: "AdpType=Prep"}] }
