  # ── the contractions (B-O4) ────────────────────────────────────────────────
  # Each is a conjunction fused with a conditional auxiliary. `parts:` is what
  # lets a consumer see both halves; without it *abych* is a word the lexicon
  # knows and the grammar cannot use.
  - { lemma: abych, upos: SCONJ, provenance: manual, parts: [aby, bych], forms: [{form: abych, feats: "Mood=Cnd|Number=Sing|Person=1"}] }
  - { lemma: abys, upos: SCONJ, provenance: manual, parts: [aby, bys], forms: [{form: abys, feats: "Mood=Cnd|Number=Sing|Person=2"}] }
  - { lemma: abychom, upos: SCONJ, provenance: manual, parts: [aby, bychom], forms: [{form: abychom, feats: "Mood=Cnd|Number=Plur|Person=1"}, {form: abysme, feats: "Mood=Cnd|Number=Plur|Person=1"}] }
  - { lemma: abyste, upos: SCONJ, provenance: manual, parts: [aby, byste], forms: [{form: abyste, feats: "Mood=Cnd|Number=Plur|Person=2"}] }
  - { lemma: kdybych, upos: SCONJ, provenance: manual, parts: [kdyby, bych], forms: [{form: kdybych, feats: "Mood=Cnd|Number=Sing|Person=1"}] }
  - { lemma: kdybys, upos: SCONJ, provenance: manual, parts: [kdyby, bys], forms: [{form: kdybys, feats: "Mood=Cnd|Number=Sing|Person=2"}] }
