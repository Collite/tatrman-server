      "Case=Nom|Number=Sing": ["e"]
      "Case=Gen|Number=Sing": ["e"]
      "Case=Dat|Number=Sing": ["i"]
      "Case=Acc|Number=Sing": ["i"]
      "Case=Voc|Number=Sing": ["e"]
      "Case=Loc|Number=Sing": ["i"]
      "Case=Ins|Number=Sing": ["í"]
      "Case=Nom|Number=Plur": ["e"]
      "Case=Gen|Number=Plur": ["í"]
      "Case=Dat|Number=Plur": ["ím"]
      "Case=Acc|Number=Plur": ["e"]
      "Case=Voc|Number=Plur": ["e"]
      "Case=Loc|Number=Plur": ["ích"]
      "Case=Ins|Number=Plur": ["emi"]

  # The citation form carries the fleeting vowel, so entries on this vzor
  # normally declare `fleeting-e` (píseň -> písn-). The vzor itself does not
  # imply it: `dlaň` and `tvář` inflect here without one.
  píseň:
    upos: NOUN
    feats_always: "Gender=Fem"
    stem: { strip: [""] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": [""]
      "Case=Gen|Number=Sing": ["ě"]
      "Case=Dat|Number=Sing": ["i"]
      "Case=Acc|Number=Sing": [""]
      "Case=Voc|Number=Sing": ["i"]
      "Case=Loc|Number=Sing": ["i"]
      "Case=Ins|Number=Sing": ["í"]
      "Case=Nom|Number=Plur": ["ě"]
      "Case=Gen|Number=Plur": ["í"]
      "Case=Dat|Number=Plur": ["ím"]
      "Case=Acc|Number=Plur": ["ě"]
      "Case=Voc|Number=Plur": ["ě"]
      "Case=Loc|Number=Plur": ["ích"]
      "Case=Ins|Number=Plur": ["ěmi"]

  kost:
    upos: NOUN
    feats_always: "Gender=Fem"
    stem: { strip: [""] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": [""]
      "Case=Gen|Number=Sing": ["i"]
      "Case=Dat|Number=Sing": ["i"]
      "Case=Acc|Number=Sing": [""]
      "Case=Voc|Number=Sing": ["i"]
      "Case=Loc|Number=Sing": ["i"]
      "Case=Ins|Number=Sing": ["í"]
      "Case=Nom|Number=Plur": ["i"]
      "Case=Gen|Number=Plur": ["í"]
      "Case=Dat|Number=Plur": ["em"]
      "Case=Acc|Number=Plur": ["i"]
      "Case=Voc|Number=Plur": ["i"]
      "Case=Loc|Number=Plur": ["ech"]
      "Case=Ins|Number=Plur": ["mi"]

  # ── Masculine inanimate ────────────────────────────────────────────────────
  hrad:
    upos: NOUN
    feats_always: "Animacy=Inan|Gender=Masc"
    stem: { strip: [""] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": [""]
      "Case=Gen|Number=Sing": ["u"]
      "Case=Dat|Number=Sing": ["u"]
      "Case=Acc|Number=Sing": [""]
      "Case=Voc|Number=Sing": ["e"]
      # A free doublet: "na hradu" and "na hradě" are both standard. Where it
      # is NOT free — proper nouns take only -u — the sub-vzor narrows it.
      "Case=Loc|Number=Sing": ["u", "ě"]
      "Case=Ins|Number=Sing": ["em"]
      "Case=Nom|Number=Plur": ["y"]
      "Case=Gen|Number=Plur": ["ů"]
      "Case=Dat|Number=Plur": ["ům"]
      "Case=Acc|Number=Plur": ["y"]
      "Case=Voc|Number=Plur": ["y"]
