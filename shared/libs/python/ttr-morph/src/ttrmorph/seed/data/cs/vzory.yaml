      "Case=Nom|Number=Plur": ["ové"]
      "Case=Gen|Number=Plur": ["ů"]
      "Case=Dat|Number=Plur": ["ům"]
      "Case=Acc|Number=Plur": ["y"]
      "Case=Voc|Number=Plur": ["ové"]
      "Case=Loc|Number=Plur": ["ech"]
      "Case=Ins|Number=Plur": ["y"]

  soudce:
    upos: NOUN
    feats_always: "Animacy=Anim|Gender=Masc"
    stem: { strip: ["e"] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
