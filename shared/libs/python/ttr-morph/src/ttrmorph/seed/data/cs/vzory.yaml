    feats_always: "Animacy=Anim|Gender=Masc"
    stem: { strip: [""] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": [""]
      "Case=Gen|Number=Sing": ["e"]
      "Case=Dat|Number=Sing": ["ovi", "i"]
      "Case=Acc|Number=Sing": ["e"]
      "Case=Voc|Number=Sing": ["i"]
      "Case=Loc|Number=Sing": ["ovi", "i"]
      "Case=Ins|Number=Sing": ["em"]
      "Case=Nom|Number=Plur": ["i"]
      "Case=Gen|Number=Plur": ["ů"]
      "Case=Dat|Number=Plur": ["ům"]
      "Case=Acc|Number=Plur": ["e"]
      "Case=Voc|Number=Plur": ["i"]
      "Case=Loc|Number=Plur": ["ích"]
      "Case=Ins|Number=Plur": ["i"]

  předseda:
    upos: NOUN
    feats_always: "Animacy=Anim|Gender=Masc"
    stem: { strip: ["a"] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": ["a"]
      "Case=Gen|Number=Sing": ["y"]
      "Case=Dat|Number=Sing": ["ovi"]
      "Case=Acc|Number=Sing": ["u"]
      "Case=Voc|Number=Sing": ["o"]
      "Case=Loc|Number=Sing": ["ovi"]
