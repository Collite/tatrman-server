      "Case=Gen|Number=Sing": ["e"]
      "Case=Dat|Number=Sing": ["ovi", "i"]
      "Case=Acc|Number=Sing": ["e"]
      "Case=Voc|Number=Sing": ["e"]
      "Case=Loc|Number=Sing": ["ovi", "i"]
      "Case=Ins|Number=Sing": ["em"]
      "Case=Nom|Number=Plur": ["i", "ové"]
