# ── Sub-vzory (B-O5) ─────────────────────────────────────────────────────────
#
# A sub-vzor is a parent plus a narrowing: overridden slots, implied flags, a
# different strip, or a restriction to part of the parent's table. It carries a
# `hints` block that the NLS-P9 pattern-guesser reads to PROPOSE it from a bare
# surface form — that is the whole reason the inventory is data and not a list
# in a design document.
#
# `lemma_pattern` is a regex matched against the citation form;
# `capitalized: true` means the guesser should only propose this for a form
# that starts uppercase. Neither is a validity rule — the analyst may always
# assign any sub-vzor — they are the guesser's prior.
subvzory:
  # Kaufland, Zlín, Excel. Proper inanimates take -u in the locative and never
  # the -ě doublet, which is the whole difference from `hrad`.
  hrad-proper:
    parent: hrad
    upos: PROPN
    hints:
      capitalized: true
      lemma_pattern: "[^aeiouyáéíóúůýě]$"
    slots:
      "Case=Loc|Number=Sing": ["u"]

  # cyklus, mýtus, kosmos. The Latin nominative marker is stripped by the
  # flag; the narrowing is the locative, which is -u only — "v cyklu", never
  # the free doublet `hrad` allows. The same reason `hrad-proper` exists: the
  # doublet is a property of native lexemes, not of the pattern.
  hrad-foreign:
    parent: hrad
    upos: NOUN
    implied_flags: [foreign-stem]
    hints:
      capitalized: false
      lemma_pattern: "(us|os|es)$"
    slots:
      "Case=Loc|Number=Sing": ["u"]

  # Kundera, Svoboda, Nosek-type -a surnames and given names.
  predseda-name:
    parent: předseda
    upos: PROPN
    hints:
      capitalized: true
      lemma_pattern: "a$"

  # Hugo, Otto, Bruno. Parent's animate endings, but the citation form and the
  # vocative end in -o and the nominative plural takes -ove.
  pan-o:
    parent: pán
    upos: PROPN
    stem: { strip: ["o"] }
    hints:
      capitalized: true
      lemma_pattern: "o$"
    slots:
      "Case=Nom|Number=Sing": ["o"]
      "Case=Voc|Number=Sing": ["o"]
      "Case=Nom|Number=Plur": ["ové"]
      "Case=Voc|Number=Plur": ["ové"]

  # atašé, Ferrari-as-a-person. Masculine animate feats, no inflection.
  indeclinable-m:
    parent: pán
    upos: NOUN
    implied_flags: [indeclinable]
    hints:
      capitalized: false
      lemma_pattern: "[éiyu]$"

  # taxi, menu, Bordeaux. Neuter feats, no inflection.
  indeclinable-n:
    parent: město
    upos: NOUN
    implied_flags: [indeclinable]
    hints:
      capitalized: false
      lemma_pattern: "[iyu]$"

  # Praha, Ostrava, Vltava.
  zena-proper:
    parent: žena
    upos: PROPN
    hints:
      capitalized: true
      lemma_pattern: "a$"

  # Sydney-type soft feminines and -e place names.
  ruze-proper:
    parent: růže
    upos: PROPN
    hints:
      capitalized: true
      lemma_pattern: "e$"

  # Nováková. The adjectival surname IS the hard adjective's feminine
  # sub-paradigm, so it is that table restricted rather than a copy of it —
  # `only_feats` keeps the two from drifting apart. Known non-goal: the
  # traditional short plural ("sestry Novákovy") is not generated.
  adj-ova:
    parent: mladý
    upos: PROPN
    stem: { strip: ["á"] }
    only_feats: ["Gender=Fem"]
    # The parent's citation slot is masculine and `only_feats` removes it, so
    # the narrowing has to say which cell is now the citation form.
    lemma_slot: "Case=Nom|Gender=Fem|Number=Sing"
    hints:
      capitalized: true
      lemma_pattern: "ová$"

  # muzeum, gymnázium, stipendium.
  muzeum-um:
    parent: město
    upos: NOUN
    stem: { strip: ["um"] }
    hints:
      capitalized: false
      lemma_pattern: "um$"
    slots:
      "Case=Nom|Number=Sing": ["um"]
      "Case=Gen|Number=Sing": ["a"]
      "Case=Dat|Number=Sing": ["u"]
      "Case=Acc|Number=Sing": ["um"]
      "Case=Voc|Number=Sing": ["um"]
      "Case=Loc|Number=Sing": ["u"]
      "Case=Ins|Number=Sing": ["em"]
      "Case=Nom|Number=Plur": ["a"]
      "Case=Gen|Number=Plur": ["í"]
      "Case=Dat|Number=Plur": ["ím"]
      "Case=Acc|Number=Plur": ["a"]
      "Case=Voc|Number=Plur": ["a"]
      "Case=Loc|Number=Plur": ["ích"]
      "Case=Ins|Number=Plur": ["i"]

  # ČEZ, ČSOB, DPH. Declines like hrad AND stays invariant, because both are
  # written — see the `acronym` flag.
  acronym-m:
    parent: hrad
    upos: PROPN
    implied_flags: [acronym]
    hints:
      capitalized: true
      lemma_pattern: "^[A-ZÁ-Ž0-9]{2,}$"
    slots:
      "Case=Loc|Number=Sing": ["u"]
