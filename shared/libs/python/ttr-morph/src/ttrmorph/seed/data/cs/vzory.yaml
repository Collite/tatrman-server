# SPDX-License-Identifier: Apache-2.0
#
# Czech paradigm tables — the DATA half of LM-2. The engine driver
# (`ttrmorph.engine`) contains no Czech: every letter of the language is in
# this file, and a second language is a second file, not a second driver. A
# guard test asserts that literally (`rg "[áéíóúůýžščřďťň]" src/ttrmorph/engine/`
# must find nothing).
#
# ── How a form is built ──────────────────────────────────────────────────────
#
#   lemma --strip--> base stem --flags--> stem --+ ending--> spelling --> form
#
# `strip` removes the vzor's citation ending (zena: "a"), flags rewrite the
# stem, the slot supplies the ending, and the spelling rules fix the
# orthography of the junction. That last step is why the flags can be so few:
# most of what looks like irregularity in a school table is Czech spelling
# rules about which vowel may follow which consonant, and those are regular.
#
# ── Slot keys ────────────────────────────────────────────────────────────────
#
# A slot key is the part of the UD feats that VARIES across the paradigm;
# `feats_always` carries what is constant for the vzor (gender, animacy,
# degree). The engine merges the two and sorts the atoms, so the emitted feats
# string is canonical UD regardless of how this file is written.
#
# Animacy appears ONLY in slots where the form actually depends on it (Acc sg
# masc, Nom/Voc pl masc for adjectives; always, via `feats_always`, for nouns
# whose lexeme has a fixed animacy). Emitting two identical forms that differ
# only in an unobservable feature would make `classify` ambiguous for no gain.
#
# A slot may hold SEVERAL endings (`Case=Loc|Number=Sing: [u, ě]`): Czech has
# genuine doublets and `generate` returns a set of (form, feats) pairs, not a
# function of feats. Where a doublet is lexically restricted rather than free,
# it belongs in a sub-vzor (see `hrad-proper`), not here.

language: cs
version: 1

# ── Orthography ──────────────────────────────────────────────────────────────
#
# Applied in order to the concatenated stem+ending. These are the rules a
# Czech school textbook states as "we do not write ..." and they are what let
# the paradigm tables below stay purely additive.
#
#   1-3. A soft consonant before a front vowel is written hard: the softness is
#        already carried by the vowel (písň+ě = "písně", not "písňě").
#   4-6. ...and before a plain `e`, the vowel takes the hook instead
#        (koť+ete = "kotěte").
#   7.   `ě` is only written after b p v f m d t n. After anything else the
#        consonant is already soft or hard-only and the vowel is plain `e`
#        (matc+ě = "matce", Praz+ě = "Praze", les+ě = "lese").
spelling:
  - { pattern: "ť(?=[ěií])", replace: "t" }
  - { pattern: "ď(?=[ěií])", replace: "d" }
  - { pattern: "ň(?=[ěií])", replace: "n" }
  - { pattern: "ťe", replace: "tě" }
  - { pattern: "ďe", replace: "dě" }
  - { pattern: "ňe", replace: "ně" }
  - { pattern: "([cčghjklrřsšzž])ě", replace: "\\1e" }

# ── Flags ────────────────────────────────────────────────────────────────────
#
# Ordered stem rewrites (contracts §4). `flag_order` is the ORDER OF
# APPLICATION and it is canonical: an entry that declares [palatal, fleeting-e]
# generates exactly what [fleeting-e, palatal] generates, because a paradigm
# that depended on the order an analyst happened to type would not be a
# function of (lemma, vzor, flags).
#
# Each flag names a `kind` the driver implements; everything else is
# parameters. The six kinds are the whole vocabulary — a seventh needs a driver
# change and a design note, which is the point.
flag_order: [foreign-stem, fleeting-e, shorten, palatal, indeclinable, acronym]

flags:
  # pes/psa, píseň/písně, matka/matek. ONE flag, both directions: the stem has
  # a vowel that appears exactly in the zero-ending slots. If the base stem
  # already carries it (pes -> ps) the flag removes it elsewhere; if it does
  # not (matk -> matek) the flag inserts it in the zero-ending slot. Writing
  # these as two flags would ask the analyst to know which side of the
  # alternation the citation form happens to sit on.
  fleeting-e:
    kind: stem-allomorph
    # The vowel is detectable only in the last syllable: "sestr" has an `e`,
    # but it is not the fleeting one (sester, not sstr), so the run of
    # consonants after it is capped.
    detect: "^(.*)e([bcčdďfghjklmnňpqrřsštťvwxzž]{1,2})$"
    short: "\\1\\2"
    insert: "^(.*?)([bcčdďfghjklmnňpqrřsštťvwxzž])$"
    long: "\\1e\\2"

  # dům/domu, sníh/sněhu, chléb/chleba. The stem vowel shortens wherever an
  # ending follows. The LAST mapped vowel is the one that shortens.
  shorten:
    kind: stem-vowel-map
    when: ending-nonempty
    map: { "ů": "o", "á": "a", "é": "e", "í": "ě", "ou": "u" }

  # matka/matce, Praha/Praze, vlk/vlci, bratr/bratři. Triggered by the ending,
  # not by the slot: the same rewrite serves the dative-e of a feminine and the
  # nominative-i of a masculine animate, which is why it is one flag.
  #
  # The two-consonant entries are the adjective series (český -> čeští,
  # anglický -> angličtí) and they must come first — the longest key wins, or
  # the cluster is rewritten as if it were the single consonant it ends with.
  # An adjective whose stem ends in a velar needs this flag: without it the
  # animate nominative plural comes out unpalatalized, which is the one form
  # the vzor alone cannot get right.
  palatal:
    kind: stem-final-map
    triggers: ["ě", "i", "í"]
    map:
      { "sk": "št", "ck": "čt", "ch": "š", "k": "c", "h": "z", "r": "ř" }

  # cyklus/cyklu, génius/génia. The Latin nominative marker is not part of the
  # stem; it survives only where nothing follows it.
  foreign-stem:
    kind: stem-strip
    when: ending-nonempty
    suffixes: ["us", "os", "es"]

  # atašé, taxi. Every slot is the citation form.
  indeclinable:
    kind: invariant

  # ČEZ/ČEZu — and "od ČEZ", which is why this is not `indeclinable`. A
  # declinable acronym is written both ways by real users, so the paradigm
  # carries both: the inflected form AND the bare lemma in every slot. That is
  # the difference between the two flags, and it is the reason `acronym` earns
  # its place: an exported gazetteer list built from it matches both.
  acronym:
    kind: add-lemma

# ── Vzory ────────────────────────────────────────────────────────────────────

vzory:
  # ── Feminine ───────────────────────────────────────────────────────────────
  žena:
    upos: NOUN
    feats_always: "Gender=Fem"
    stem: { strip: ["a"] }
    lemma_slot: "Case=Nom|Number=Sing"
    slots:
      "Case=Nom|Number=Sing": ["a"]
      "Case=Gen|Number=Sing": ["y"]
      "Case=Dat|Number=Sing": ["ě"]
      "Case=Acc|Number=Sing": ["u"]
      "Case=Voc|Number=Sing": ["o"]
      "Case=Loc|Number=Sing": ["ě"]
      "Case=Ins|Number=Sing": ["ou"]
      "Case=Nom|Number=Plur": ["y"]
      "Case=Gen|Number=Plur": [""]
      "Case=Dat|Number=Plur": ["ám"]
      "Case=Acc|Number=Plur": ["y"]
      "Case=Voc|Number=Plur": ["y"]
      "Case=Loc|Number=Plur": ["ách"]
      "Case=Ins|Number=Plur": ["ami"]

  růže:
    upos: NOUN
    feats_always: "Gender=Fem"
    stem: { strip: ["e"] }
    lemma_slot: "Case=Nom|Number=Sing"
