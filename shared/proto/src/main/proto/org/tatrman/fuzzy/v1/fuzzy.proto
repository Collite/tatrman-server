syntax = "proto3";

package org.tatrman.fuzzy.v1;

option java_multiple_files = true;
option java_package = "org.tatrman.fuzzy.v1";
option java_outer_classname = "FuzzyProto";

service FuzzyService {
  rpc Match (MatchRequest) returns (FuzzyMatchResponse) {}
  // RG-P2.S2 (additive): N spans × M categories in ONE rpc (the resolver's
  // gate-spans call). Results are positional to `spans`.
  rpc BatchMatch (BatchMatchRequest) returns (BatchMatchResponse) {}
  // Category discovery + staleness (contracts §2).
  rpc GetStatus (FuzzyStatusRequest) returns (FuzzyStatusResponse) {}
}

message BatchMatchRequest {
  repeated SpanQuery spans = 1;
  optional string locale = 2; // RS-11
}

message SpanQuery {
  string query = 1;
  repeated string categories = 2; // match across these; explicit-unknown ⇒ EMPTY (leak guard, per-slot)
  int32 limit = 3;
}

message BatchMatchResponse {
  repeated FuzzyMatchResponse results = 1; // positional to BatchMatchRequest.spans
}

message FuzzyStatusRequest {}

message FuzzyStatusResponse {
  bool ready = 1;
  string vocabulary_version = 2;      // snapshot hash + load stamp (S-1)
  repeated CategoryStatus categories = 3;
  repeated LoaderWarning warnings = 4; // B-T4: PK-skipped declared columns (RG-FUZ-001)
  LayerVersions layer_versions = 5;    // RV-39 (RV-P1.4)
}

message CategoryStatus {
  string category = 1;
  SourceTag source = 2;
  int32 size = 3;           // candidate count
  int64 loaded_at_epoch_ms = 4;
}

message LoaderWarning {
  string code = 1;          // e.g. "RG-FUZ-001"
  string category = 2;
  string message = 3;
}

message MatchRequest {
  string query = 1;
  optional string category = 2; // Optional filter by category
  optional string algorithm = 3; // Legacy single-algorithm selection (e.g. "LEVENSHTEIN", "JARO_WINKLER", "TATRMAN")
  int32 limit = 4; // Optional limit for number of results
  // Optional algorithm cascade. When non-empty it overrides `algorithm`:
  // the algorithms are tried in order and the first whose top-1 score meets
  // its min_score wins (precision-first, recall-fallback). If none qualify,
  // the last algorithm's best-effort results are returned.
  repeated AlgorithmSpec algorithms = 5;
}

// One step of an algorithm cascade: run `algorithm`, and treat it as the
// winner if its top candidate scores >= `min_score`.
message AlgorithmSpec {
  string algorithm = 1; // "LEVENSHTEIN" | "TATRMAN" | "JARO_WINKLER" | ...
  double min_score = 2; // cascade gate on the top-1 score (not an output filter)
}

message FuzzyMatchResponse {
  repeated FuzzyMatch matches = 1;
  bool is_error = 2;
  string error = 3;
  string matched_algorithm = 4; // Which algorithm produced these results (cascade winner / last tried)
  // RG-P2 additive (S-1): snapshot hash + per-category load timestamp of the
  // vocabulary that produced these results. Populated from RG-P2.S2 (refresh).
  string vocabulary_version = 5;
  // RV-39 (RV-P1.4): the layer tuple. Additive — `vocabulary_version` above is untouched.
  LayerVersions layer_versions = 6;
}

// RG-P2 (contracts §2, RS-15): how a candidate's category was sourced.
// RV-P1.4: widened to RV contracts §1's four layers (additive, J-v2 — existing values keep
// their numbers). MEMBER *is* RV's DATA; VOCABULARY is the pre-RV conflation of DECLARED and
// METADATA, kept for the fixture-stub source that cannot tell them apart.
enum SourceTag {
  MEMBER = 0;      // data value — candidate_id is a data PK (→ resolved_id). RV: DATA.
  VOCABULARY = 1;  // legacy: declared lexicon/valueLabels, undifferentiated
  DECLARED = 2;    // authored in the lexicon/ area or as TTR-M `def term` sugar
  METADATA = 3;    // harvested from model labels (displayLabel/labelPlural/aliases/valueLabels)
  LEARNED = 4;     // the RV-P6 estate overlay; nothing produces it yet
}

// RV-39 — the layer-version tuple, echoed per S-1. Additive alongside the older opaque
// `vocabulary_version` string, which stays: the two answer different questions, and the old one
// bakes in the member load stamp so it moves on every refresh whether or not a layer changed.
message LayerVersions {
  string lexicon_artifact_hash = 1;               // CompiledLexicon.contentHash; "" when none loaded
  map<string, string> member_index_versions = 2;  // category → content-derived version
  optional string overlay_version = 3;            // ABSENT until RV-P6 — absence is the contract
}

// RG-P2 (S-4): confidence provenance — producer + scoring method + raw score.
message Provenance {
  string producer = 1;  // e.g. "fuzzy"
  string method = 2;    // the algorithm that scored it, e.g. "TATRMAN"
  double raw_score = 3;
}

message FuzzyMatch {
  string candidate_id = 1;
  string candidate = 2;
  double score = 3; // Similarity score/distance
  string category = 4;
  // RG-P2 additive (response-side; the pinned MatchRequest is untouched):
  SourceTag source = 5;
  optional string target_ref = 6;  // set iff the candidate is vocabulary (→ lexicon target)
  Provenance provenance = 7;       // S-4
  // RV-32 (RV-P1.4): the AUTHORED match method — EXACT | TOKENS | TYPOS(n). A different axis from
  // Provenance.method, which is the algorithm that produced the score. Absent for member values:
  // nobody authored a method for a data value.
  optional string match_method = 8;
  // RV-32 (RV-P1.4 T4): TOKENS only — how far this candidate's target beat the best OTHER target
  // in the declared layer for this query. Negative when a better target exists. ABSENT for every
  // other method: absence means "no uniqueness decision applies here", which `0` would not.
  optional double uniqueness_margin = 9;
  // RV-32: false ⇒ the caller MUST NOT auto-bind this candidate (the margin is under the floor, or
  // another target won). Absent ⇒ no such decision was made — the pre-RV shape.
  optional bool auto_bindable = 10;
}
